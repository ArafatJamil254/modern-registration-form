<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-card">
    <div class="auth-header">
      <div class="logo-icon">🚀</div>
      <h1>Create an account</h1>
      <p class="subtitle">Start your 14-day free trial. No credit card required.</p>
    </div>

    <form class="auth-form" id="registerForm" novalidate>
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <div class="input-wrapper">
          <input type="text" id="fullName" placeholder="Arafat Jamil" required>
        </div>
        <span class="error-msg" id="nameError"></span>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <input type="email" id="email" placeholder="you@example.com" required>
        </div>
        <span class="error-msg" id="emailError"></span>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Create a strong password" required>
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password visibility">
            👁️
          </button>
        </div>
        <div class="strength-meter">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
        <span class="strength-text" id="strengthText">Must be at least 8 characters</span>
      </div>

      <div class="checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="termsCheckbox" required>
          <span class="custom-checkbox"></span>
          <span class="label-text">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></span>
        </label>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">Create Account</button>
    </form>

    <div class="auth-footer">
      <p>Already have an account? <a href="#">Sign in</a></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
